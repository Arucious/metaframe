name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v0.1.0)'
        required: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: metaframe-linux
            asset_name: metaframe-linux-amd64
          - os: windows-latest
            artifact_name: metaframe.exe
            asset_name: metaframe-windows-amd64.exe
          - os: macos-latest
            artifact_name: metaframe
            asset_name: metaframe-macos-arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libegl1 \
            libgl1

      - name: Build with PyInstaller
        run: |
          pyinstaller metaframe.spec --noconfirm

      - name: Rename artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mv dist/metaframe dist/${{ matrix.artifact_name }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.artifact_name }}
          if-no-files-found: error

      - name: Upload macOS app bundle
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: metaframe-macos-app
          path: dist/MetaFrame.app
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -la artifacts/

      - name: Prepare release files
        run: |
          mkdir -p release
          # Linux
          cp artifacts/metaframe-linux-amd64/metaframe-linux release/metaframe-linux-amd64
          chmod +x release/metaframe-linux-amd64
          # Windows
          cp artifacts/metaframe-windows-amd64.exe/metaframe.exe release/metaframe-windows-amd64.exe
          # macOS
          cp artifacts/metaframe-macos-arm64/metaframe release/metaframe-macos-arm64
          chmod +x release/metaframe-macos-arm64
          # macOS app bundle (if exists)
          if [ -d "artifacts/metaframe-macos-app" ]; then
            cd artifacts/metaframe-macos-app
            zip -r ../../release/MetaFrame-macos.app.zip MetaFrame.app
            cd ../..
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short

      - name: Run linter
        run: |
          ruff check src/
